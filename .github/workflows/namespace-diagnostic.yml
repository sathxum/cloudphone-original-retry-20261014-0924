name: Namespace parser read-only diagnostic
'on':
  push:
    paths:
      - .github/workflows/namespace-diagnostic.yml
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Capture once and compare encrypted inventory
        shell: bash
        run: |
          /usr/bin/timeout --signal=KILL 85s /usr/bin/python3 -I -B - <<'CP_DIAGNOSTIC_PY'
          import base64, hashlib, hmac, json, os, re, shlex, subprocess, sys, tempfile, textwrap, traceback
          SOURCES = {'old': '#!/usr/bin/python3\n"""Read-only pre-acquisition check; --check is the ONLY supported CLI action.\n\nParent embeds this source in a trusted root shell function, for example:\n  cloudphone_namespace_check() {\n    /usr/bin/timeout --signal=KILL 35s /usr/bin/python3 -I -B - --check <<\'CP_NAMESPACE_PY\'\n    ...this file verbatim...\n    CP_NAMESPACE_PY\n  }\nThen append acquire-namespace.sh in the SAME root shell. Do not authorize acquire\nwith a cached result or an environment-supplied arbitrary script path. All writers\nmust remain excluded between inventory and exclusive mkdir. This checker cannot\natomically lock systemd, kernel mounts, and other root writers.\n\nNormal vendor UnitPath directories, merged-/usr aliases, empty service.d, masked\nand shadowed generic drop-ins are handled, not blanket-refused. An EFFECTIVE\nnon-masked service.d/*.conf is incompatible with recovery-fence.py\'s current\nDropInPaths==\'\' contract and is reported as such (not called foreign). No removal\nor host normalization is attempted. Parent must resolve that incompatibility\nexplicitly; this helper must never silently whitelist it for the existing fence.\n"""\nimport json\nimport os\nfrom pathlib import PurePosixPath as P\nimport re\nimport selectors\nimport shlex\nimport signal\nimport stat\nimport subprocess\nimport sys\nimport time\n\nFIXED = (\n    \'cloudphone-job-deadline.service\', \'cloudphone-job-installer.service\',\n    \'cloudphone-platform.service\', \'cloudphone-platform-broker.service\',\n    \'cloudphone-platform-tunnel.service\', \'cloudphone-platform-origin.service\',\n)\nPATHS = (\n    \'/run/cloudphone-job-budget\', \'/run/cloudphone-provider\', \'/run/cloudphone-public-test\',\n    \'/opt/cloudphone-platform\', \'/opt/cloudphone-ngrok\', \'/etc/cloudphone-platform\',\n    \'/etc/cloudphone-platform-web\', \'/var/lib/cloudphone-platform\',\n)\n# Also refuse old/default PhoneManager state; do not claim ownership of it.\nSTORAGE = (\'/var/lib/cloudphone-platform\', \'/var/lib/cloudphone\')\nPHONE = re.compile(r\'cloudphone-[a-f0-9]{16}\\.service\\Z\')\nRELATED = re.compile(r\'(?<![A-Za-z0-9_-])(?:\' + \'|\'.join(re.escape(x) for x in FIXED) + r\'|cloudphone-[a-f0-9]{16}\\.service)(?![A-Za-z0-9_.-])\')\nPREFIX_DIRS = {\'cloudphone-.service.d\', \'cloudphone-job-.service.d\', \'cloudphone-platform-.service.d\'}\nEXTRA_UNIT_PATHS = (\n    \'/etc/systemd/system.control\', \'/run/systemd/system.control\', \'/run/systemd/transient\',\n    \'/run/systemd/generator.early\', \'/run/systemd/generator\', \'/run/systemd/generator.late\',\n    \'/etc/systemd/system\', \'/run/systemd/system\',\n)\nUNIT_SUFFIXES = (\'.service\', \'.socket\', \'.timer\', \'.path\', \'.target\', \'.mount\', \'.automount\', \'.slice\', \'.scope\', \'.swap\')\n\n\nclass Refusal(Exception):\n    def __init__(self, code, path=None):\n        self.code, self.path = code, path\n        super().__init__(code)\n\n\nclass Host:\n    """Read-only adapter. Tests inject ALL filesystem/command access."""\n    def lstat(self, path):\n        return os.lstat(path)\n\n    def readlink(self, path):\n        return os.readlink(path)\n\n    def names(self, path, limit):\n        result = []\n        with os.scandir(path) as entries:\n            for entry in entries:\n                if len(result) >= limit:\n                    raise Refusal(\'directory-inventory-limit\', path)\n                result.append(entry.name)\n        return sorted(result)\n\n    def read(self, path, limit):\n        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n        try:\n            st = os.fstat(fd)\n            if not stat.S_ISREG(st.st_mode):\n                raise Refusal(\'not-regular-file\', path)\n            if st.st_size > limit:\n                raise Refusal(\'file-size-limit\', path)\n            chunks = bytearray()\n            while True:\n                chunk = os.read(fd, min(65536, limit + 1 - len(chunks)))\n                if not chunk:\n                    return bytes(chunks)\n                chunks.extend(chunk)\n                if len(chunks) > limit:\n                    raise Refusal(\'file-size-limit\', path)\n        finally:\n            os.close(fd)\n\n    def run(self, argv, seconds, limit):\n        # Only caller\'s fixed read-only argv reach this adapter. GNU timeout also\n        # bounds descendants; bounded incremental reads avoid unlimited capture.\n        child = subprocess.Popen([\'/usr/bin/timeout\', \'--signal=KILL\', str(seconds) + \'s\', *argv],\n                                 stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\n                                 env={\'PATH\': \'/usr/sbin:/usr/bin:/sbin:/bin\', \'LANG\': \'C\', \'SYSTEMD_COLORS\': \'0\'},\n                                 start_new_session=True, close_fds=True)\n        deadline = time.monotonic() + seconds + 0.25\n        selector = selectors.DefaultSelector()\n        selector.register(child.stdout, selectors.EVENT_READ)\n        output = bytearray()\n        try:\n            while selector.get_map():\n                remaining = deadline - time.monotonic()\n                if remaining <= 0:\n                    raise Refusal(\'command-timeout\')\n                for key, _ in selector.select(min(0.1, remaining)):\n                    data = os.read(key.fileobj.fileno(), 65536)\n                    if not data:\n                        selector.unregister(key.fileobj)\n                    else:\n                        output.extend(data)\n                        if len(output) > limit:\n                            raise Refusal(\'command-output-limit\')\n            code = child.wait(timeout=max(0.01, deadline - time.monotonic()))\n            return code, output.decode(\'utf-8\', \'strict\')\n        finally:\n            selector.close()\n            if child.poll() is None:\n                os.killpg(child.pid, signal.SIGKILL)\n            child.wait()\n            child.stdout.close()\n\n\ndef owned(name):\n    return name in FIXED or PHONE.fullmatch(name) is not None\n\n\ndef underneath(path, parent):\n    return path == parent or path.startswith(parent + \'/\')\n\n\nclass NamespaceCheck:\n    def __init__(self, host=None, clock=time.monotonic):\n        self.host = host or Host()\n        self.clock = clock\n        self.deadline = clock() + 30\n        self.entries = 0\n        self.bytes = 0\n        self.unit_paths = []\n        self.generic_masked = 0\n\n    def timecheck(self):\n        if self.clock() >= self.deadline:\n            raise Refusal(\'inventory-timeout\')\n\n    def optional_stat(self, p):\n        self.timecheck()\n        try:\n            return self.host.lstat(p)\n        except FileNotFoundError:\n            return None\n\n    def names(self, p):\n        self.timecheck()\n        names = self.host.names(p, 8192)\n        if len(names) > 8192 or any(not n or n in (\'.\', \'..\') or \'/\' in n or \'\\0\' in n for n in names):\n            raise Refusal(\'invalid-directory-inventory\', p)\n        self.entries += len(names)\n        if self.entries > 32768:\n            raise Refusal(\'total-inventory-limit\')\n        return names\n\n    def read(self, p, limit=262144):\n        self.timecheck()\n        value = self.host.read(p, limit)\n        self.bytes += len(value)\n        if len(value) > limit or self.bytes > 16 * 1024 * 1024:\n            raise Refusal(\'read-budget-exceeded\', p)\n        return value.decode(\'utf-8\', \'strict\')\n\n    def command(self, args, absent_ok=False):\n        self.timecheck()\n        code, output = self.host.run(args, min(3, self.deadline - self.clock()), 2 * 1024 * 1024)\n        if code != 0 and not (absent_ok and code == 1):\n            raise Refusal(\'read-only-command-failed\')\n        if len(output.encode()) > 2 * 1024 * 1024:\n            raise Refusal(\'command-output-limit\')\n        self.timecheck()\n        return output\n\n    def trusted(self, p, links=False, missing=False):\n        """Walk lexical and resolved ancestors, allowing only trusted UnitPath links.\n\n        No realpath-only check: that would skip a writable lexical parent.\n        Returns canonical absolute path or None for a missing component.\n        """\n        if not isinstance(p, str) or not p.startswith(\'/\') or str(P(p)) != p or \'..\' in P(p).parts or \'\\0\' in p:\n            raise Refusal(\'invalid-path\')\n        pending = list(P(p).parts[1:])\n        current = \'/\'\n        hops = 0\n        root = self.optional_stat(\'/\')\n        if root is None or not stat.S_ISDIR(root.st_mode) or root.st_uid != 0 or root.st_mode & 0o022:\n            raise Refusal(\'unsafe-ancestor\', \'/\')\n        while pending:\n            part = pending.pop(0)\n            candidate = str(P(current) / part)\n            st = self.optional_stat(candidate)\n            if st is None:\n                if missing:\n                    return None\n                raise Refusal(\'missing-ancestor\', candidate)\n            if st.st_uid != 0:\n                raise Refusal(\'unsafe-owner\', candidate)\n            if stat.S_ISLNK(st.st_mode):\n                if not links or hops >= 24:\n                    raise Refusal(\'unsafe-path-symlink\', candidate)\n                hops += 1\n                dest = self.host.readlink(candidate)\n                combined = os.path.normpath(dest if dest.startswith(\'/\') else str(P(current) / dest))\n                pending = list(P(combined).parts[1:]) + pending\n                current = \'/\'\n                continue\n            if st.st_mode & 0o022:\n                raise Refusal(\'writable-root-path\', candidate)\n            if pending and not stat.S_ISDIR(st.st_mode):\n                raise Refusal(\'non-directory-ancestor\', candidate)\n            current = candidate\n        return current\n\n    def absence(self):\n        for target in (*PATHS, STORAGE[1]):\n            self.trusted(str(P(target).parent))\n            if self.optional_stat(target) is not None:\n                raise Refusal(\'namespace-path-occupied\', target)\n        if self.host.readlink(\'/proc/self/ns/mnt\') != self.host.readlink(\'/proc/1/ns/mnt\'):\n            raise Refusal(\'not-pid1-mount-namespace\')\n        if self.host.readlink(\'/proc/self/ns/cgroup\') != self.host.readlink(\'/proc/1/ns/cgroup\'):\n            raise Refusal(\'not-pid1-cgroup-namespace\')\n\n    def manager(self):\n        raw = self.command([\'/usr/bin/systemctl\', \'show\', \'--property=UnitPath\', \'--value\'])\n        try:\n            paths = shlex.split(raw)\n        except ValueError:\n            raise Refusal(\'invalid-unit-path-inventory\') from None\n        if not paths or len(paths) > 64 or len(set(paths)) != len(paths):\n            raise Refusal(\'invalid-unit-path-inventory\')\n        for p in paths:\n            if not re.fullmatch(r\'/[A-Za-z0-9_./-]+\', p) or str(P(p)) != p or \'..\' in P(p).parts:\n                raise Refusal(\'invalid-unit-path-inventory\')\n        self.unit_paths = paths\n        for unit in FIXED:\n            text = self.command([\'/usr/bin/systemctl\', \'show\', unit, \'--all\', \'--property=Id,Names,LoadState,ActiveState,SubState,MainPID,ControlPID,ControlGroup,Job,FragmentPath,SourcePath,DropInPaths\'], absent_ok=True)\n            props = {}\n            for line in text.splitlines():\n                key, sep, value = line.partition(\'=\')\n                if not sep or key in props:\n                    raise Refusal(\'ambiguous-unit-properties\', unit)\n                props[key] = value\n            if (props.get(\'Id\') != unit or props.get(\'Names\') != unit or props.get(\'LoadState\') != \'not-found\'\n                    or props.get(\'ActiveState\') != \'inactive\' or props.get(\'SubState\') != \'dead\'\n                    or props.get(\'MainPID\') != \'0\' or props.get(\'ControlPID\') != \'0\'\n                    or props.get(\'Job\') not in (\'\', \'0\')\n                    or any(props.get(k) != \'\' for k in (\'ControlGroup\', \'FragmentPath\', \'SourcePath\', \'DropInPaths\'))):\n                raise Refusal(\'fixed-unit-not-absent\', unit)\n        rows = self.command([\'/usr/bin/systemctl\', \'list-units\', \'--all\', \'--full\', \'--plain\', \'--no-legend\', \'--no-pager\'])\n        loaded = []\n        for row in rows.splitlines():\n            fields = row.split()\n            if len(fields) < 4 or not re.fullmatch(r\'[A-Za-z0-9_.@:\\\\-]+\', fields[0]):\n                raise Refusal(\'invalid-loaded-unit-inventory\')\n            if fields[0] in FIXED and fields[1:4] == [\'not-found\', \'inactive\', \'dead\']:\n                continue  # show may retain a positively validated absent object\n            if owned(fields[0]):\n                raise Refusal(\'existing-owned-unit\', fields[0])\n            loaded.append(fields[0])\n        if len(loaded) > 4096 or len(set(loaded)) != len(loaded):\n            raise Refusal(\'loaded-unit-inventory-limit\')\n        # list-units reports canonical names only; inspect Names to find loaded\n        # aliases whose symlink has disappeared from the filesystem.\n        for offset in range(0, len(loaded), 128):\n            batch = loaded[offset:offset + 128]\n            text = self.command([\'/usr/bin/systemctl\', \'show\', *batch, \'--all\', \'--property=Id,Names\'])\n            observed = set()\n            for block in text.strip().split(\'\\n\\n\'):\n                props = {}\n                for line in block.splitlines():\n                    key, sep, value = line.partition(\'=\')\n                    if not sep or key in props:\n                        raise Refusal(\'invalid-loaded-alias-inventory\')\n                    props[key] = value\n                if set(props) != {\'Id\', \'Names\'} or props[\'Id\'] not in batch or props[\'Id\'] in observed or props[\'Id\'] not in props[\'Names\'].split():\n                    raise Refusal(\'invalid-loaded-alias-inventory\')\n                observed.add(props[\'Id\'])\n                if any(owned(name) for name in props[\'Names\'].split()):\n                    raise Refusal(\'loaded-owned-alias\', props[\'Id\'])\n            if observed != set(batch):\n                raise Refusal(\'incomplete-loaded-alias-inventory\')\n        jobs = self.command([\'/usr/bin/systemctl\', \'list-jobs\', \'--all\', \'--plain\', \'--no-legend\', \'--no-pager\'])\n        seen = set()\n        for line in jobs.splitlines():\n            fields = line.split()\n            if len(fields) != 4 or not re.fullmatch(\'[1-9][0-9]*\', fields[0]) or fields[0] in seen:\n                raise Refusal(\'invalid-job-inventory\')\n            seen.add(fields[0])\n            if owned(fields[1]):\n                raise Refusal(\'pending-owned-job\', fields[1])\n        if len(seen) > 8192:\n            raise Refusal(\'job-inventory-limit\')\n\n    def related_name(self, name):\n        if owned(name) or name in PREFIX_DIRS or (name.endswith((\'.socket\', \'.timer\', \'.path\')) and owned(name.rsplit(\'.\', 1)[0] + \'.service\')):\n            return True\n        for suffix in (\'.d\', \'.wants\', \'.requires\', \'.upholds\'):\n            if name.endswith(suffix) and owned(name[:-len(suffix)]):\n                return True\n        # A preexisting template could instantiate a conflicting phone service.\n        return name == \'cloudphone@.service\' or name.startswith(\'cloudphone@.service.\')\n\n    def resolve_unit_entry(self, p):\n        """Inspect alias chains (even dangling) for references before following."""\n        current = p\n        for _ in range(24):\n            if self.related_name(P(current).name):\n                raise Refusal(\'unit-alias-or-reference\', current)\n            st = self.optional_stat(current)\n            if st is None:\n                # Dangling aliases elsewhere are not evidence of an owned unit.\n                return None\n            if stat.S_ISLNK(st.st_mode):\n                if st.st_uid != 0:\n                    raise Refusal(\'unsafe-unit-symlink\', current)\n                target = self.host.readlink(current)\n                if target == \'/dev/null\':\n                    return \'/dev/null\'\n                current = os.path.normpath(target if target.startswith(\'/\') else str(P(current).parent / target))\n                self.trusted(str(P(current).parent), links=True, missing=True)\n            else:\n                return self.trusted(current, links=True)\n        raise Refusal(\'unit-alias-cycle\', p)\n\n    def references(self, p):\n        st = self.optional_stat(p)\n        if st is None or not stat.S_ISREG(st.st_mode):\n            raise Refusal(\'unsafe-unit-file\', p)\n        content = self.read(p)\n        # Ignore comments; inspect directives without attempting to execute or\n        # expand specifiers. Conservative lexical references cover activation,\n        # OnFailure, dependencies, and exec lines referencing this namespace.\n        for line in content.splitlines():\n            line = line.strip()\n            if not line or line.startswith((\'#\', \';\')):\n                continue\n            if RELATED.search(line) or any(target in line for target in (*PATHS, *STORAGE)):\n                raise Refusal(\'unit-content-references-namespace\', p)\n\n    def filesystem_units(self):\n        canonical_seen = set()\n        generic_seen = set()\n        unit_seen = set()\n        for base in dict.fromkeys([*self.unit_paths, *EXTRA_UNIT_PATHS]):\n            canonical = self.trusted(base, links=True, missing=True)\n            if canonical is None or canonical in canonical_seen:\n                continue\n            canonical_seen.add(canonical)\n            if not stat.S_ISDIR(self.host.lstat(canonical).st_mode):\n                raise Refusal(\'unit-path-not-directory\', base)\n            for name in self.names(canonical):\n                p = str(P(canonical) / name)\n                if self.related_name(name):\n                    raise Refusal(\'owned-unit-artifact\', p)\n                if name == \'service.d\':\n                    directory = self.trusted(p, links=True)\n                    if not stat.S_ISDIR(self.host.lstat(directory).st_mode):\n                        raise Refusal(\'invalid-generic-dropin-directory\', p)\n                    for config in self.names(directory):\n                        if not config.endswith(\'.conf\') or config in generic_seen:\n                            continue\n                        generic_seen.add(config)\n                        entry = self.resolve_unit_entry(str(P(directory) / config))\n                        if entry == \'/dev/null\':\n                            self.generic_masked += 1\n                        elif entry is not None and self.host.lstat(entry).st_size == 0:\n                            self.generic_masked += 1\n                        else:\n                            # The fence requires empty DropInPaths. Even benign\n                            # vendor defaults need an explicit coordinated change.\n                            raise Refusal(\'effective-generic-dropin-incompatible-with-fence\', str(P(directory) / config))\n                    continue\n                st = self.host.lstat(p)\n                if stat.S_ISDIR(st.st_mode) or (stat.S_ISLNK(st.st_mode) and name.endswith((\'.d\', \'.wants\', \'.requires\', \'.upholds\'))):\n                    if not name.endswith((\'.d\', \'.wants\', \'.requires\', \'.upholds\')):\n                        continue\n                    directory = self.trusted(p, links=True)\n                    if not stat.S_ISDIR(self.host.lstat(directory).st_mode):\n                        raise Refusal(\'invalid-unit-subdirectory\', p)\n                    for child in self.names(directory):\n                        if name.endswith(\'.d\') and not child.endswith(\'.conf\'):\n                            continue\n                        childpath = str(P(directory) / child)\n                        if self.related_name(child):\n                            raise Refusal(\'activation-or-dropin-reference\', childpath)\n                        resolved = self.resolve_unit_entry(childpath)\n                        if resolved not in (None, \'/dev/null\'):\n                            self.references(resolved)\n                elif name.endswith(UNIT_SUFFIXES) or stat.S_ISLNK(st.st_mode):\n                    resolved = self.resolve_unit_entry(p)\n                    if resolved not in (None, \'/dev/null\') and name not in unit_seen:\n                        self.references(resolved)\n                    unit_seen.add(name)\n\n    def cgroups(self):\n        base = \'/sys/fs/cgroup\'\n        self.trusted(base)\n        # Require cgroup v2, not an empty unrelated directory in another mount.\n        self.read(base + \'/cgroup.controllers\', 65536)\n        pending = [(base, 0)]\n        while pending:\n            directory, depth = pending.pop()\n            if depth > 32:\n                raise Refusal(\'cgroup-depth-limit\')\n            for name in self.names(directory):\n                p = str(P(directory) / name)\n                st = self.host.lstat(p)\n                if owned(name):\n                    # Empty old groups are still preexisting namespace evidence.\n                    # Never treat a missing events file as proof of emptiness.\n                    raise Refusal(\'preexisting-owned-cgroup\', p)\n                if stat.S_ISLNK(st.st_mode):\n                    raise Refusal(\'unexpected-cgroup-symlink\', p)\n                if stat.S_ISDIR(st.st_mode):\n                    pending.append((p, depth + 1))\n\n    def storage(self):\n        text = self.command([\'/usr/sbin/losetup\', \'--json\', \'--list\', \'--output\', \'NAME,BACK-FILE\'])\n        inventory = json.loads(text)\n        devices = inventory.get(\'loopdevices\') if isinstance(inventory, dict) else None\n        if not isinstance(devices, list) or len(devices) > 4096:\n            raise Refusal(\'invalid-loop-inventory\')\n        seen = set()\n        for device in devices:\n            if (not isinstance(device, dict) or not isinstance(device.get(\'name\'), str)\n                    or not re.fullmatch(r\'/dev/loop[0-9]+\', device[\'name\']) or device[\'name\'] in seen\n                    or not isinstance(device.get(\'back-file\'), str) or not device[\'back-file\'].startswith(\'/\')):\n                raise Refusal(\'invalid-loop-identity\')\n            seen.add(device[\'name\'])\n            backing = device[\'back-file\'].removesuffix(\' (deleted)\')\n            normalized = os.path.normpath(backing)\n            if any(underneath(normalized, parent) for parent in (*PATHS, *STORAGE)):\n                raise Refusal(\'owned-loop-already-attached\', device[\'name\'])\n            # Read-only alias traversal does not require unrelated images to be\n            # root-owned. Inspect symlinks even under /tmp, including dangling\n            # targets, without opening any image or trusting its contents.\n            pending = list(P(normalized).parts[1:])\n            current, hops = \'/\', 0\n            while pending:\n                self.timecheck()\n                candidate = str(P(current).joinpath(*pending))\n                if any(underneath(candidate, parent) for parent in (*PATHS, *STORAGE)):\n                    raise Refusal(\'owned-loop-alias\', device[\'name\'])\n                next_path = str(P(current) / pending.pop(0))\n                st = self.optional_stat(next_path)\n                if st is None:\n                    break\n                if stat.S_ISLNK(st.st_mode):\n                    hops += 1\n                    if hops > 24:\n                        raise Refusal(\'loop-backing-alias-cycle\', device[\'name\'])\n                    link = self.host.readlink(next_path)\n                    target = os.path.normpath(link if link.startswith(\'/\') else str(P(current) / link))\n                    pending = list(P(target).parts[1:]) + pending\n                    current = \'/\'\n                else:\n                    current = next_path\n        mountinfo = self.read(\'/proc/self/mountinfo\', 2 * 1024 * 1024)\n        cgroup2 = False\n        for row in mountinfo.splitlines():\n            left, separator, right = row.partition(\' - \')\n            fields, extra = left.split(), right.split()\n            if not separator or len(fields) < 6 or len(extra) < 3 or not fields[0].isdigit() or not fields[1].isdigit():\n                raise Refusal(\'invalid-mount-inventory\')\n            def unescape(value):\n                return re.sub(r\'\\\\([0-7]{3})\', lambda m: chr(int(m[1], 8)), value)\n            target = unescape(fields[4])\n            mount_root = unescape(fields[3]).removesuffix(\' (deleted)\')\n            # A retained bind mount can outlive the removed source path. A root\n            # matching our full namespace is conflicting evidence even on a\n            # filesystem where it is filesystem-relative, not host-relative.\n            if any(underneath(mount_root, p) for p in (*PATHS, *STORAGE)):\n                raise Refusal(\'retained-namespace-mount-root\', target)\n            if not target.startswith(\'/\'):\n                raise Refusal(\'invalid-mount-target\')\n            if any(underneath(target, p) for p in (*PATHS, *STORAGE)):\n                raise Refusal(\'namespace-mount-exists\', target)\n            if target == \'/sys/fs/cgroup\' and extra[0] == \'cgroup2\':\n                cgroup2 = True\n        if not cgroup2:\n            raise Refusal(\'host-cgroup-v2-not-established\')\n\n    def check(self):\n        try:\n            self.absence()\n            self.manager()\n            self.filesystem_units()\n            self.cgroups()\n            self.storage()\n            # Recheck paths at the end, not a cached start-of-inventory result.\n            self.ab