contract and is reported as such (not called foreign). No removal\nor host normalization is attempted. Parent must resolve that incompatibility\nexplicitly; this helper must never silently whitelist it for the existing fence.\n"""\nimport json\nimport os\nfrom pathlib import PurePosixPath as P\nimport re\nimport selectors\nimport shlex\nimport signal\nimport stat\nimport subprocess\nimport sys\nimport time\n\nFIXED = (\n    \'cloudphone-job-deadline.service\', \'cloudphone-job-installer.service\',\n    \'cloudphone-platform.service\', \'cloudphone-platform-broker.service\',\n    \'cloudphone-platform-tunnel.service\', \'cloudphone-platform-origin.service\',\n)\nPATHS = (\n    \'/run/cloudphone-job-budget\', \'/run/cloudphone-provider\', \'/run/cloudphone-public-test\',\n    \'/opt/cloudphone-platform\', \'/opt/cloudphone-ngrok\', \'/etc/cloudphone-platform\',\n    \'/etc/cloudphone-platform-web\', \'/var/lib/cloudphone-platform\',\n)\n# Also refuse old/default PhoneManager state; do not claim ownership of it.\nSTORAGE = (\'/var/lib/cloudphone-platform\', \'/var/lib/cloudphone\')\nPHONE = re.compile(r\'cloudphone-[a-f0-9]{16}\\.service\\Z\')\nRELATED = re.compile(r\'(?<![A-Za-z0-9_-])(?:\' + \'|\'.join(re.escape(x) for x in FIXED) + r\'|cloudphone-[a-f0-9]{16}\\.service)(?![A-Za-z0-9_.-])\')\nPREFIX_DIRS = {\'cloudphone-.service.d\', \'cloudphone-job-.service.d\', \'cloudphone-platform-.service.d\'}\nEXTRA_UNIT_PATHS = (\n    \'/etc/systemd/system.control\', \'/run/systemd/system.control\', \'/run/systemd/transient\',\n    \'/run/systemd/generator.early\', \'/run/systemd/generator\', \'/run/systemd/generator.late\',\n    \'/etc/systemd/system\', \'/run/systemd/system\',\n)\nUNIT_SUFFIXES = (\'.service\', \'.socket\', \'.timer\', \'.path\', \'.target\', \'.mount\', \'.automount\', \'.slice\', \'.scope\', \'.swap\')\n\n\nclass Refusal(Exception):\n    def __init__(self, code, path=None):\n        self.code, self.path = code, path\n        super().__init__(code)\n\n\nclass Host:\n    """Read-only adapter. Tests inject ALL filesystem/command access."""\n    def lstat(self, path):\n        return os.lstat(path)\n\n    def readlink(self, path):\n        return os.readlink(path)\n\n    def names(self, path, limit):\n        result = []\n        with os.scandir(path) as entries:\n            for entry in entries:\n                if len(result) >= limit:\n                    raise Refusal(\'directory-inventory-limit\', path)\n                result.append(entry.name)\n        return sorted(result)\n\n    def read(self, path, limit):\n        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n        try:\n            st = os.fstat(fd)\n            if not stat.S_ISREG(st.st_mode):\n                raise Refusal(\'not-regular-file\', path)\n            if st.st_size > limit:\n                raise Refusal(\'file-size-limit\', path)\n            chunks = bytearray()\n            while True:\n                chunk = os.read(fd, min(65536, limit + 1 - len(chunks)))\n                if not chunk:\n                    return bytes(chunks)\n                chunks.extend(chunk)\n                if len(chunks) > limit:\n                    raise Refusal(\'file-size-limit\', path)\n        finally:\n            os.close(fd)\n\n    def run(self, argv, seconds, limit):\n        # Only caller\'s fixed read-only argv reach this adapter. GNU timeout also\n        # bounds descendants; bounded incremental reads avoid unlimited capture.\n        child = subprocess.Popen([\'/usr/bin/timeout\', \'--signal=KILL\', str(seconds) + \'s\', *argv],\n                                 stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\n                                 env={\'PATH\': \'/usr/sbin:/usr/bin:/sbin:/bin\', \'LANG\': \'C\', \'SYSTEMD_COLORS\': \'0\'},\n                                 start_new_session=True, close_fds=True)\n        deadline = time.monotonic() + seconds + 0.25\n        selector = selectors.DefaultSelector()\n        selector.register(child.stdout, selectors.EVENT_READ)\n        output = bytearray()\n        try:\n            while selector.get_map():\n                remaining = deadline - time.monotonic()\n                if remaining <= 0:\n                    raise Refusal(\'command-timeout\')\n                for key, _ in selector.select(min(0.1, remaining)):\n                    data = os.read(key.fileobj.fileno(), 65536)\n                    if not data:\n                        selector.unregister(key.fileobj)\n                    else:\n                        output.extend(data)\n                        if len(output) > limit:\n                            raise Refusal(\'command-output-limit\')\n            code = child.wait(timeout=max(0.01, deadline - time.monotonic()))\n            return code, output.decode(\'utf-8\', \'strict\')\n        finally:\n            selector.close()\n            if child.poll() is None:\n                os.killpg(child.pid, signal.SIGKILL)\n            child.wait()\n            child.stdout.close()\n\n\ndef owned(name):\n    return name in FIXED or PHONE.fullmatch(name) is not None\n\n\ndef underneath(path, parent):\n    return path == parent or path.startswith(parent + \'/\')\n\n\nclass NamespaceCheck:\n    def __init__(self, host=None, clock=time.monotonic):\n        self.host = host or Host()\n        self.clock = clock\n        self.deadline = clock() + 30\n        self.entries = 0\n        self.bytes = 0\n        self.unit_paths = []\n        self.generic_masked = 0\n\n    def timecheck(self):\n        if self.clock() >= self.deadline:\n            raise Refusal(\'inventory-timeout\')\n\n    def optional_stat(self, p):\n        self.timecheck()\n        try:\n            return self.host.lstat(p)\n        except FileNotFoundError:\n            return None\n\n    def names(self, p):\n        self.timecheck()\n        names = self.host.names(p, 8192)\n        if len(names) > 8192 or any(not n or n in (\'.\', \'..\') or \'/\' in n or \'\\0\' in n for n in names):\n            raise Refusal(\'invalid-directory-inventory\', p)\n        self.entries += len(names)\n        if self.entries > 32768:\n            raise Refusal(\'total-inventory-limit\')\n        return names\n\n    def read(self, p, limit=262144):\n        self.timecheck()\n        value = self.host.read(p, limit)\n        self.bytes += len(value)\n        if len(value) > limit or self.bytes > 16 * 1024 * 1024:\n            raise Refusal(\'read-budget-exceeded\', p)\n        return value.decode(\'utf-8\', \'strict\')\n\n    def command(self, args, absent_ok=False):\n        self.timecheck()\n        code, output = self.host.run(args, min(3, self.deadline - self.clock()), 2 * 1024 * 1024)\n        if code != 0 and not (absent_ok and code == 1):\n            raise Refusal(\'read-only-command-failed\')\n        if len(output.encode()) > 2 * 1024 * 1024:\n            raise Refusal(\'command-output-limit\')\n        self.timecheck()\n        return output\n\n    def trusted(self, p, links=False, missing=False):\n        """Walk lexical and resolved ancestors, allowing only trusted UnitPath links.\n\n        No realpath-only check: that would skip a writable lexical parent.\n        Returns canonical absolute path or None for a missing component.\n        """\n        if not isinstance(p, str) or not p.startswith(\'/\') or str(P(p)) != p or \'..\' in P(p).parts or \'\\0\' in p:\n            raise Refusal(\'invalid-path\')\n        pending = list(P(p).parts[1:])\n        current = \'/\'\n        hops = 0\n        root = self.optional_stat(\'/\')\n        if root is None or not stat.S_ISDIR(root.st_mode) or root.st_uid != 0 or root.st_mode & 0o022:\n            raise Refusal(\'unsafe-ancestor\', \'/\')\n        while pending:\n            part = pending.pop(0)\n            candidate = str(P(current) / part)\n            st = self.optional_stat(candidate)\n            if st is None:\n                if missing:\n             