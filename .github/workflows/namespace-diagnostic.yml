!= p or \'..\' in P(p).parts:\n                raise Refusal(\'invalid-unit-path-inventory\')\n        self.unit_paths = paths\n        for unit in FIXED:\n            text = self.command([\'/usr/bin/systemctl\', \'show\', unit, \'--all\', \'--property=Id,Names,LoadState,ActiveState,SubState,MainPID,ControlPID,ControlGroup,Job,FragmentPath,SourcePath,DropInPaths\'], absent_ok=True)\n            props = {}\n            for line in text.splitlines():\n                key, sep, value = line.partition(\'=\')\n                if not sep or key in props:\n                    raise Refusal(\'ambiguous-unit-properties\', unit)\n                props[key] = value\n            if (props.get(\'Id\') != unit or props.get(\'Names\') != unit or props.get(\'LoadState\') != \'not-found\'\n                    or props.get(\'ActiveState\') != \'inactive\' or props.get(\'SubState\') != \'dead\'\n                    or props.get(\'MainPID\') != \'0\' or props.get(\'ControlPID\') != \'0\'\n                    or props.get(\'Job\') not in (\'\', \'0\')\n                    or any(props.get(k) != \'\' for k in (\'ControlGroup\', \'FragmentPath\', \'SourcePath\', \'DropInPaths\'))):\n                raise Refusal(\'fixed-unit-not-absent\', unit)\n        rows = self.command([\'/usr/bin/systemctl\', \'list-units\', \'--all\', \'--full\', \'--plain\', \'--no-legend\', \'--no-pager\'])\n        loaded = []\n        for row in rows.splitlines():\n            fields = row.split()\n            if len(fields) < 4 or not re.fullmatch(r\'[A-Za-z0-9_.@:\\\\-]+\', fields[0]):\n                raise Refusal(\'invalid-loaded-unit-inventory\')\n            if fields[0] in FIXED and fields[1:4] == [\'not-found\', \'inactive\', \'dead\']:\n                continue  # show may retain a positively validated absent object\n            if owned(fields[0]):\n                raise Refusal(\'existing-owned-unit\', fields[0])\n            loaded.append(fields[0])\n        if len(loaded) > 4096 or len(set(loaded))